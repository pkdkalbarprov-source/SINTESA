<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SINTESA — Dashboard Terpadu DPMD Kalimantan Barat</title>
<style>
  :root{
    --coral:#e8697c;
    --coral-deep:#c94f63;
    --ink:#3a2c2f;
    --cream:#fbf3ee;
    --sidebar-w: 84px;
    --sidebar-w-expanded: 240px;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    height:100%;
    overflow:hidden;
    font-family:'Trebuchet MS','Segoe UI',sans-serif;
    background:var(--cream);
    color:var(--ink);
  }

  #app{
    display:flex;
    height:100vh;
    width:100vw;
  }

  /* ============== SIDEBAR ============== */
  #sidebar{
    width:var(--sidebar-w);
    flex:0 0 var(--sidebar-w);
    background:linear-gradient(180deg,var(--ink) 0%, #2c2224 100%);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:18px 0;
    transition:flex-basis .22s ease, width .22s ease;
    z-index:100;
    position:relative;
  }

  #sidebar.expanded{
    width:var(--sidebar-w-expanded);
    flex-basis:var(--sidebar-w-expanded);
  }

  .brand{
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:0 10px 18px;
    margin-bottom:8px;
    border-bottom:1px solid rgba(255,255,255,.12);
  }
  .brand .mark{
    width:42px;height:42px;
    border-radius:12px;
    background:linear-gradient(135deg,var(--coral),var(--coral-deep));
    display:flex;align-items:center;justify-content:center;
    font-weight:800;color:#fff;font-size:1rem;
    letter-spacing:.02em;
    flex:0 0 auto;
    box-shadow:0 6px 16px -6px rgba(232,105,124,.6);
  }
  .brand .full-name{
    color:#fff;
    font-size:.68rem;
    font-weight:700;
    letter-spacing:.06em;
    text-transform:uppercase;
    margin-top:10px;
    text-align:center;
    opacity:0;
    max-height:0;
    overflow:hidden;
    transition:opacity .18s ease;
  }
  #sidebar.expanded .brand .full-name{
    opacity:.85;
    max-height:40px;
    margin-top:10px;
  }

  nav#menu{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:6px;
    padding:10px 10px;
    overflow-y:auto;
    flex:1 1 auto;
  }

  .menu-item{
    display:flex;
    align-items:center;
    gap:12px;
    width:100%;
    padding:11px 12px;
    border-radius:12px;
    background:transparent;
    border:none;
    cursor:pointer;
    color:rgba(255,255,255,.68);
    text-align:left;
    position:relative;
    transition:background .15s ease, color .15s ease;
  }
  .menu-item:hover{
    background:rgba(255,255,255,.08);
    color:#fff;
  }
  .menu-item.active{
    background:linear-gradient(135deg,var(--coral),var(--coral-deep));
    color:#fff;
    box-shadow:0 6px 18px -6px rgba(232,105,124,.55);
  }
  .menu-item .icon{
    flex:0 0 auto;
    width:22px;height:22px;
    display:flex;align-items:center;justify-content:center;
  }
  .menu-item .icon svg{
    width:20px;height:20px;
    stroke:currentColor;
    fill:none;
    stroke-width:1.8;
    stroke-linecap:round;
    stroke-linejoin:round;
  }
  .menu-item .label{
    font-size:.78rem;
    font-weight:700;
    white-space:nowrap;
    opacity:0;
    max-width:0;
    overflow:hidden;
    transition:opacity .15s ease;
  }
  #sidebar.expanded .menu-item .label{
    opacity:1;
    max-width:160px;
  }

  /* tooltip saat sidebar tertutup */
  .menu-item .tip{
    position:absolute;
    left:calc(100% + 12px);
    top:50%;
    transform:translateY(-50%);
    background:#fff;
    color:var(--ink);
    font-size:.72rem;
    font-weight:700;
    padding:7px 12px;
    border-radius:9px;
    white-space:nowrap;
    box-shadow:0 12px 26px -8px rgba(0,0,0,.35);
    opacity:0;
    visibility:hidden;
    pointer-events:none;
    transition:opacity .15s ease, transform .15s ease;
    z-index:200;
  }
  #sidebar:not(.expanded) .menu-item:hover .tip{
    opacity:1;
    visibility:visible;
    transform:translateY(-50%) translateX(4px);
  }

  #collapseToggle{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    padding:12px 10px;
    background:transparent;
    border:none;
    border-top:1px solid rgba(255,255,255,.12);
    color:rgba(255,255,255,.55);
    cursor:pointer;
    flex:0 0 auto;
  }
  #collapseToggle:hover{ color:#fff; }
  #collapseToggle svg{
    width:18px;height:18px;
    stroke:currentColor;fill:none;stroke-width:2;
    transition:transform .22s ease;
  }
  #sidebar.expanded #collapseToggle svg{ transform:rotate(180deg); }
  #collapseToggle .clabel{
    font-size:.7rem;font-weight:700;
    opacity:0;max-width:0;overflow:hidden;white-space:nowrap;
    transition:opacity .15s ease;
  }
  #sidebar.expanded #collapseToggle .clabel{ opacity:.8; max-width:140px; }

  /* ============== KONTEN ============== */
  #content{
    flex:1 1 auto;
    position:relative;
    background:var(--cream);
    height:100vh;
  }

  .frame-wrap{
    position:absolute;
    inset:0;
    opacity:0;
    visibility:hidden;
    transition:opacity .18s ease;
  }
  .frame-wrap.active{
    opacity:1;
    visibility:visible;
  }

  .frame-wrap iframe{
    width:100%;
    height:100%;
    border:none;
    display:block;
    background:var(--cream);
  }

  .loading{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:12px;
    color:var(--ink);
    opacity:.6;
    font-size:.85rem;
    font-weight:700;
    pointer-events:none;
  }
  .loading .spinner{
    width:34px;height:34px;
    border-radius:50%;
    border:3px solid rgba(58,44,47,.15);
    border-top-color:var(--coral);
    animation:spin .8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* scrollbar tipis untuk menu */
  nav#menu::-webkit-scrollbar{ width:5px; }
  nav#menu::-webkit-scrollbar-thumb{ background:rgba(255,255,255,.15); border-radius:10px; }

  @media (max-width:720px){
    :root{ --sidebar-w:64px; --sidebar-w-expanded:210px; }
    .brand .mark{ width:36px;height:36px;font-size:.85rem; }
  }
</style>
</head>
<body>

<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <div class="mark">SI</div>
      <div class="full-name">SINTESA DPMD KALBAR</div>
    </div>
    <nav id="menu"></nav>
    <button id="collapseToggle" title="Perluas / ciutkan menu">
      <svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
      <span class="clabel">Perluas Menu</span>
    </button>
  </aside>

  <main id="content"></main>
</div>

<script>
/* ============================================================
   KONFIGURASI MENU SIDEBAR
   ------------------------------------------------------------
   Tambah / ubah / hapus modul cukup dengan mengedit array MENU
   di bawah ini. Setiap item butuh:
     - id     : pengenal unik (dipakai untuk state aktif)
     - label  : nama yang tampil saat sidebar diperluas & tooltip
     - src    : path file HTML modul (di folder pages/)
     - icon   : markup SVG (stroke-based, warna ikut currentColor)
   ============================================================ */
const MENU = [
  {
    id: 'dashboard',
    label: 'Dashboard Utama',
    src: 'pages/page1.html',
    icon: `<svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>`
  },
  {
    id: 'sandi-desa',
    label: 'SANDI DESA',
    src: 'pages/page2.html',
    icon: `<svg viewBox="0 0 24 24"><path d="M3 12l2-2 4 4L19 4l2 2-12 12-6-6z"/><path d="M3 19h18"/></svg>`
  },
  {
    id: 'siperdin',
    label: 'SIPERDIN',
    src: 'pages/page3.html',
    icon: `<svg viewBox="0 0 24 24"><path d="M4 4h16v4H4z"/><path d="M4 10h10v10H4z"/><path d="M16 10h4v4h-4z"/><path d="M16 16h4v4h-4z"/></svg>`
  },
  {
    id: 'sipedes',
    label: 'SIPEDES KALBAR',
    src: 'pages/page4.html',
    icon: `<svg viewBox="0 0 24 24"><path d="M12 3l9 6-9 6-9-6 9-6z"/><path d="M3 15l9 6 9-6"/><path d="M3 9v6"/><path d="M21 9v6"/></svg>`
  },
  {
    id: 'simak-desa',
    label: 'SIMAK DESA',
    src: 'pages/page5.html',
    icon: `<svg viewBox="0 0 24 24"><path d="M5 3h9l5 5v13H5z"/><path d="M14 3v5h5"/><path d="M9 13h6"/><path d="M9 17h6"/></svg>`
  }
];

/* ============================================================ */

const menuEl = document.getElementById('menu');
const contentEl = document.getElementById('content');
const sidebarEl = document.getElementById('sidebar');
const collapseBtn = document.getElementById('collapseToggle');

const loadedFrames = new Set();

function buildMenu(){
  MENU.forEach((item, idx) => {
    const btn = document.createElement('button');
    btn.className = 'menu-item' + (idx === 0 ? ' active' : '');
    btn.dataset.id = item.id;
    btn.innerHTML = `
      <span class="icon">${item.icon}</span>
      <span class="label">${item.label}</span>
      <span class="tip">${item.label}</span>
    `;
    btn.addEventListener('click', () => activate(item.id));
    menuEl.appendChild(btn);

    const wrap = document.createElement('div');
    wrap.className = 'frame-wrap' + (idx === 0 ? ' active' : '');
    wrap.dataset.id = item.id;
    wrap.innerHTML = `<div class="loading"><div class="spinner"></div><span>Memuat ${item.label}...</span></div>`;
    contentEl.appendChild(wrap);
  });
}

function loadFrame(id){
  if (loadedFrames.has(id)) return;
  const item = MENU.find(m => m.id === id);
  const wrap = contentEl.querySelector(`.frame-wrap[data-id="${id}"]`);
  const iframe = document.createElement('iframe');
  iframe.src = item.src;
  iframe.title = item.label;
  iframe.addEventListener('load', () => {
    const loadingEl = wrap.querySelector('.loading');
    if (loadingEl) loadingEl.remove();
  });
  wrap.appendChild(iframe);
  loadedFrames.add(id);
}

function activate(id){
  document.querySelectorAll('.menu-item').forEach(b => b.classList.toggle('active', b.dataset.id === id));
  document.querySelectorAll('.frame-wrap').forEach(w => w.classList.toggle('active', w.dataset.id === id));
  loadFrame(id);
}

collapseBtn.addEventListener('click', () => {
  sidebarEl.classList.toggle('expanded');
});

buildMenu();
loadFrame(MENU[0].id); // muat modul pertama langsung
</script>

</body>
</html>
